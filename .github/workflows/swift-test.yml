name: Swift Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Swift Test
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Run tests
        run: swift test

      # The release configuration enables optimisation and whole-module builds,
      # which surface diagnostics the debug build does not. Nothing guarded it
      # before this job existed.
      - name: Build release configuration
        run: swift build -c release
