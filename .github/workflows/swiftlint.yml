name: SwiftLint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  swiftlint:
    name: SwiftLint
    # Pinned to the same image as the other workflows so all three jobs agree.
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install SwiftLint
        # NOT version-pinned yet. This job runs with --strict, so an upstream
        # SwiftLint release that adds or tightens a rule fails CI on an unrelated
        # PR. `swiftlint version` is printed so that breakage is at least
        # diagnosable from the log. Real pinning is tracked as follow-up work.
        run: |
          brew install swiftlint
          swiftlint version

      - name: Run SwiftLint
        run: swiftlint lint --strict --reporter github-actions-logging
